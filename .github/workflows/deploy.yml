# Publica o site no Cloudflare Pages a cada merge na main (substitui o
# `npm run deploy` manual). Precisa dos segredos CLOUDFLARE_API_TOKEN e
# CLOUDFLARE_ACCOUNT_ID; o nome do projeto e a branch de produção vêm das
# variáveis do repositório, com padrão magic-portal / main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publicar no Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch="$PROD_BRANCH" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'magic-portal' }}
          PROD_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH || 'main' }}
