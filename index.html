<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08080f" />
    <meta name="description" content="Portal de encomendas de cartas — catálogo, pedidos e painel de vendas." />
    <title>Cartas para Jogar</title>

    <!-- PWA: manifesto + ícones. No iOS o push só funciona com o app na tela de início. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cartas" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      body { margin: 0; background: #08080f; }
      :root[data-theme='light'] body { background: #f6f1e6; }
    </style>

    <!-- Aplica o tema salvo antes do primeiro paint: sem isso o modo claro
         pisca escuro enquanto o React não monta. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cpj_color_mode');
          var mode = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', mode);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'light' ? '#f6f1e6' : '#08080f');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
