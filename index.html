<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem `maximum-scale`/`user-scalable=no`: travar o zoom reprova a WCAG
         1.4.4 e é o que mais dói para quem precisa aproximar o texto. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Portal de encomendas de cartas — catálogo, pedidos e painel de vendas." />
    <title>Cartas para Jogar</title>

    <!-- PWA: manifesto + ícones. No iOS o push só funciona com o app na tela de início. -->
    <!-- Fontes no <head>: antes elas vinham de um @import dentro de um <style>
         renderizado pelo React, então o navegador só as descobria depois do JS
         montar — o título trocava de fonte na cara do usuário. Só os
         pesos que o app realmente usa (400/500/600/700). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cartas" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      body { margin: 0; background: #0b0b0c; }
      :root[data-theme='light'] body { background: #fafaf8; }
    </style>

    <!-- Aplica o tema salvo antes do primeiro paint: sem isso o modo claro
         pisca escuro enquanto o React não monta. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cpj_color_mode');
          var mode = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', mode);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'light' ? '#fafaf8' : '#0b0b0c');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
